<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рунический ключ — NFC-квест для D&D</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#efe4cc;--card:#f8f0dc;--ink:#2b2218;--mut:#6d5c44;--acc:#8a2f1d;--line:#c9b68f;--ok:#2f6b3a;--land:#e8d9b5;--water:#8fb0ad;--fog:#bba57a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110d;--card:#211a13;--ink:#eadfc6;--mut:#a8977a;--acc:#e0a24a;--line:#4a3b29;--ok:#7cc487;--land:#2a2118;--water:#27474a;--fog:#0f0c09}}
:root[data-theme="dark"]{--bg:#15110d;--card:#211a13;--ink:#eadfc6;--mut:#a8977a;--acc:#e0a24a;--line:#4a3b29;--ok:#7cc487;--land:#2a2118;--water:#27474a;--fog:#0f0c09}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.55;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:22px 20px;box-shadow:0 4px 18px #0003}
h1,h2{margin:.2em 0 .4em;color:var(--acc);font-weight:700;letter-spacing:.02em}
h1{font-size:1.7rem;text-align:center}h2{font-size:1.35rem}
.num{font-size:.85rem;color:var(--mut);text-transform:uppercase;letter-spacing:.15em}
.lore{font-style:italic;color:var(--mut)}
.riddle{border-left:3px solid var(--acc);padding:4px 0 4px 14px;margin:16px 0;font-size:1.1rem}
input{width:100%;padding:12px;font:inherit;font-size:1.1rem;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;margin:8px 0}
button,.btn{font:inherit;background:var(--acc);color:var(--bg);border:0;border-radius:10px;padding:11px 18px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}
button.ghost{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.msg{min-height:1.5em;font-weight:700}.bad{color:var(--acc)}.good{color:var(--ok)}
.rune{font-size:5rem;text-align:center;color:var(--acc);line-height:1;margin:10px 0;text-shadow:0 0 18px var(--acc)}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.slot{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.6rem;color:var(--acc)}
.slot small{font-size:.65rem;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
code{word-break:break-all;font-size:.8rem}
.map{width:100%;height:auto;display:block;border:2px solid var(--line);border-radius:10px;margin:12px 0;background:var(--land)}
.land{fill:var(--land)}.wat{fill:var(--water);stroke:var(--line);stroke-width:2}.mt{fill:none;stroke:var(--mut);stroke-width:2.5}.tr{fill:var(--mut);opacity:.6}
.pth{fill:none;stroke:var(--acc);stroke-width:3;stroke-dasharray:6 5}.mk{fill:var(--card);stroke:var(--acc);stroke-width:3}
.fog{fill:var(--fog);stroke:var(--line);stroke-width:2}.ft{fill:var(--mut);font:bold 22px Georgia,serif;text-anchor:middle}
.grid{fill:none;stroke:var(--line);stroke-width:1.5}.hit{fill:transparent;cursor:pointer}.hit:hover{fill:#ffffff22}.sel{fill:var(--acc);opacity:.35;stroke:var(--acc);stroke-width:3}
.foot{text-align:center;color:var(--mut);font-size:.8rem;margin-top:18px}
</style></head><body><main id="app"></main>
<script>
var CARDS=[
["Шёпот в пещере","Стены дрожат от голоса, которого здесь нет."],
["Тёмный коридор","Свеча дрожит, и на стене вырастает силуэт."],
["Песочные часы","Песок застыл в воздухе, не падая."],
["Кузница","Горн остыл, но угли ещё помнят жар."],
["Железная дверь","На двери нет ни ручки, ни замочной скважины."],
["Гнездо грифона","В гнезде лежит нечто гладкое и тёплое."],
["Зал отражений","Из серебряной рамы на вас смотрит кто-то знакомый."],
["Склеп","Каменная плита холодна, и на ней нет имени."],
["Раскопки","Земля осыпается под ногами, открывая пустоту."],
["Лунный алтарь","Свет луны падает на алтарь, и всё стихает."]];
var POS=[3,7,0,9,5,1,8,2,6,4],KEY="moonseal_keys1",S={};
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var app=document.getElementById("app");
function cnt(){var k=0;for(var n=0;n<10;n++)if(S[n])k++;return k}
function solvedPos(p){return S[POS.indexOf(p)]}
var RN=["M14 1L3 11L14 21","M8 21V1M8 12L1 4M8 12L15 4","M2 2V20M14 2V20M2 2L14 20M14 2L2 20","M4 1V21M4 3L14 8M4 9L14 14","M11 1L4 8L12 14L5 21","M8 1L2 8L8 14L14 8ZM4 12L2 21M12 12L14 21","M4 21V1M4 8L13 2M4 14L13 8"];
var KB='<rect x="190" y="155" width="360" height="30" rx="4" fill="#b8862b" stroke="#6b4a12" stroke-width="2"/><line x1="226" y1="160" x2="530" y2="160" stroke="#e3b85a" stroke-width="1.5" opacity=".7"/><rect x="212" y="146" width="14" height="48" rx="3" fill="#8a6420" stroke="#6b4a12" stroke-width="2"/><rect x="535" y="146" width="14" height="48" rx="3" fill="#8a6420" stroke="#6b4a12" stroke-width="2"/><path d="M560 155L640 155L640 240L616 240L616 212L604 212L604 228L584 228L584 200L572 200L572 185L560 185Z" fill="#b8862b" stroke="#6b4a12" stroke-width="2" stroke-linejoin="round"/><circle cx="600" cy="172" r="5" fill="#6b4a12"/><g fill="none" stroke="#3d2a08" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'+RN.map(function(d,i){return '<path transform="translate('+(245+44*i)+',159)" d="'+d+'"/>'}).join("")+'</g><circle cx="140" cy="170" r="72" fill="#b8862b" stroke="#6b4a12" stroke-width="2"/><circle cx="140" cy="170" r="50" fill="#8a6420" stroke="#6b4a12" stroke-width="2"/><circle cx="140" cy="170" r="28" fill="#f1e2b0"/><circle cx="151" cy="165" r="24" fill="#8a6420"/>';
function keySVG(hi){var rv="",fg="",g="",d=cnt()===10;
for(var i=0;i<10;i++){var x=62+i*59;
if(solvedPos(i))rv+='<rect x="'+x+'" y="90" width="59" height="160"/>';
else fg+='<rect class="fog" x="'+x+'" y="90" width="59" height="160"/><text class="ft" x="'+(x+29.5)+'" y="178">?</text>';
g+='<rect class="grid" x="'+x+'" y="90" width="59" height="160"/>'}
var h=hi>=0?'<rect x="'+(62+hi*59)+'" y="90" width="59" height="160" fill="none" stroke="#e3b85a" stroke-width="4"/>':"";
var gold=d?'<rect x="64" y="92" width="586" height="156" fill="none" stroke="#e3b85a" stroke-width="5"/>':"";
return '<svg class="map" viewBox="62 90 590 160" role="img"><title>Рунический ключ</title><defs><clipPath id="rv">'+rv+'</clipPath></defs><g clip-path="url(#rv)">'+KB+'</g>'+fg+g+h+gold+'</svg>'}
function home(){var d=cnt()===10;app.innerHTML='<div class="card"><div class="num">Приключение</div><h1>Рунический ключ</h1><p class="lore">Вход в подземелье запечатан. Открыть его может только рунический ключ, но он рассыпался на десять частей. По ходу истории вы будете находить NFC-ключи. Приложите телефон к ключу, и откроется одна часть рунического ключа.</p><div class="msg">Открыто частей: '+cnt()+' из 10</div>'+keySVG(-1)+(d?'<div class="msg good">Ключ собран полностью. Он подходит к двери подземелья.</div><p class="lore">Рунические знаки на стержне вспыхивают золотом, и вход в подземелье открывается. Мастер, продолжайте историю!</p>':'')+'</div>'}
function card(n){var i=n-1,fresh=!S[i];S[i]=1;save();var d=cnt()===10;
app.innerHTML='<div class="card"><div class="num">NFC-ключ '+n+' из 10</div><h2>'+CARDS[i][0]+'</h2><p class="lore">'+CARDS[i][1]+'</p><div class="msg good">'+(fresh?'Часть рунического ключа открыта.':'Эта часть уже открыта.')+'</div>'+keySVG(POS[i])+'<div class="msg">Открыто частей: '+cnt()+' из 10</div>'+(d?'<div class="msg good">Ключ собран полностью. Он подходит к двери подземелья.</div><p class="lore">Рунические знаки на стержне вспыхивают золотом, и вход в подземелье открывается. Мастер, продолжайте историю!</p>':'')+'<div class="row"><a class="btn ghost" href="#">Весь ключ</a></div></div>'}
function dm(){var base=location.href.split("#")[0],h='<div class="card"><div class="num">Только для мастера</div><h2>Панель ДМ</h2><p>Запишите каждую ссылку на отдельную NFC-метку (NFC Tools → Записать → URL). Выдавайте метки игрокам по ходу сюжета. Каждое касание открывает одну часть ключа. Части идут в порядке, перемешанном для интриги.</p><div class="scroll"><table><tr><th>№</th><th>Ссылка</th><th>Сцена</th><th>Часть ключа</th></tr>';
CARDS.forEach(function(c,i){h+='<tr><td>'+(i+1)+'</td><td><code>'+base+'#card-'+(i+1)+'</code></td><td>'+c[0]+'</td><td>'+(POS[i]+1)+'-я слева</td></tr>'});
h+='</table></div><div class="row"><button class="ghost" id="rs">Сбросить прогресс на этом устройстве</button></div></div>';
app.innerHTML=h;document.getElementById("rs").onclick=function(){S={};save();dm()}}
function route(){var h=(location.hash||"").slice(1),m=h.match(/^card-(\d+)$/);
if(m&&+m[1]>=1&&+m[1]<=10)card(+m[1]);else if(h==="dm")dm();else home();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);route();
</script></body></html>
